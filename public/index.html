<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Préstamos (20%)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 sm:p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">💰 Control de Préstamos (20% Fijo)</h1>

    <!-- Métrica Financiera -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
        <p class="text-gray-500 text-xs sm:text-sm">Total Prestado</p>
        <p id="res-prestado" class="text-lg sm:text-2xl font-bold text-gray-800">$0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-yellow-500">
        <p class="text-gray-500 text-xs sm:text-sm">Por Cobrar</p>
        <p id="res-cobrar" class="text-lg sm:text-2xl font-bold text-gray-800">$0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
        <p class="text-gray-500 text-xs sm:text-sm">Intereses (20%)</p>
        <p id="res-intereses" class="text-lg sm:text-2xl font-bold text-gray-800">$0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
        <p class="text-gray-500 text-xs sm:text-sm">Vencidos</p>
        <p id="res-vencidos" class="text-lg sm:text-2xl font-bold text-gray-800">0</p>
      </div>
    </div>

    <!-- Formularios -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Registrar Cliente</h2>
        <form id="form-cliente" class="space-y-3">
          <input type="text" id="cli-nombre" placeholder="Nombre completo" required class="w-full border p-2 rounded">
          <input type="text" id="cli-documento" placeholder="Cédula / Documento" required class="w-full border p-2 rounded">
          <input type="text" id="cli-telefono" placeholder="Teléfono" class="w-full border p-2 rounded">
          <input type="text" id="cli-direccion" placeholder="Dirección" class="w-full border p-2 rounded">
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">Guardar Cliente</button>
        </form>
      </div>

      <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Nuevo Préstamo (+20%)</h2>
        <form id="form-prestamo" class="space-y-3">
          <select id="pres-cliente" required class="w-full border p-2 rounded">
            <option value="">Seleccione un cliente...</option>
          </select>
          <input type="number" id="pres-monto" placeholder="Monto a prestar" required class="w-full border p-2 rounded">
          <input type="date" id="pres-limite" class="w-full border p-2 rounded">
          <button type="submit" class="w-full bg-green-600 text-white py-2 rounded font-medium hover:bg-green-700">Crear Préstamo</button>
        </form>
      </div>
    </div>

    <!-- Lista de Préstamos -->
    <div class="bg-white p-6 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Historial de Préstamos</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b bg-gray-50 text-gray-600 text-sm">
              <th class="p-3">Cliente</th>
              <th class="p-3">Monto</th>
              <th class="p-3">Saldo</th>
              <th class="p-3">Total (+20%)</th>
              <th class="p-3">Límite</th>
              <th class="p-3">Estado</th>
              <th class="p-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-prestamos"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
<!-- Lista de Clientes Registrados -->
<div class="bg-white p-6 rounded-xl shadow mt-6">
  <h2 class="text-xl font-semibold mb-4 text-gray-700">Lista de Clientes</h2>
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b bg-gray-50 text-gray-600 text-sm">
          <th class="p-3">Nombre</th>
          <th class="p-3">Documento</th>
          <th class="p-3">Teléfono</th>
          <th class="p-3">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-clientes"></tbody>
    </table>
  </div>
</div><button 
    onclick="enviarWhatsApp('${p.telefono}', '${p.cliente}', '${p.monto}')"
    class="bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-3 rounded ml-2">
    📱 WhatsApp
</button>
